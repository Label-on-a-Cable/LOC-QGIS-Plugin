[pytest]
testpaths = tests
qt_api = pyqt6
addopts = -ra --strict-markers -m "not visual and not live"
markers =
    e2e: full plugin workflow through the toolbar actions
    visual: recorded step-by-step video scenarios (run with tests/run_videos.sh)
    live: recorded scenarios against a real LOC server (tests/run_live_videos.sh)
    live_write: live scenario that really pushes (needs --allow-push; Test Location only)
filterwarnings =
    ignore::DeprecationWarning
